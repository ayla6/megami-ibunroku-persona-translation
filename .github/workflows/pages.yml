name: Deploy web patcher

# The site is webpatcher/ together with the selected release's patch ZIP.
# There is no build step: persona-patches.zip is
# unpacked into webpatcher/patches (git-ignored, so a fresh checkout only
# has it after the unpack step) and goes out inside the artifact. The page
# cannot fetch release assets at runtime - github.com serves release
# downloads without CORS headers, so a browser blocks those requests - but
# everything under patches/ is same-origin and served by Pages like any
# other file.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (empty selects the latest release)'
        required: false
        type: string

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release run uses a tag ref, which the github-pages environment may
  # reject. Dispatch a separate run on main and carry the release tag as data.
  dispatch-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate the option wording
        run: python3 tools/generate_features.py
      - name: Unpack the release patch zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$(ls webpatcher/patches 2>/dev/null)" ]; then
            echo 'webpatcher/patches already has files; leaving them in place'
            exit 0
          fi
          mkdir -p webpatcher/patches "$RUNNER_TEMP/release"
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/release" --clobber --pattern 'persona-patches.zip'
          unzip -q "$RUNNER_TEMP/release/persona-patches.zip" -d webpatcher/patches
      - name: Stamp the page with the patch release
        run: python3 tools/stamp_webpatcher.py webpatcher/index.html webpatcher/patches/manifest.tsv
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webpatcher
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
