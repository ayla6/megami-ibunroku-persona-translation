name: Deploy web patcher

# The site is the webpatcher/ directory together with the patches it serves.
# There is no build step: the patches are mirrored from the latest release
# into webpatcher/patches (git-ignored, so a fresh checkout only has it
# after the mirror step) and go out inside the artifact. The page cannot
# fetch release assets at runtime - github.com serves release downloads
# without CORS headers, so a browser blocks those requests - but everything
# under patches/ is same-origin and served by Pages like any other file.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Mirror the release patches
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p webpatcher/patches
          gh release download ${TAG:+"$TAG"} --repo "$GITHUB_REPOSITORY" \
            --dir webpatcher/patches --clobber \
            --pattern '*.xdelta' --pattern 'manifest.tsv' --pattern 'README.txt'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webpatcher
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
